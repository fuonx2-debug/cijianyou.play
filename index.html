<title>瓷都大亂鬥試玩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 佈局：橫版一屏。上排=回合、事件、所有玩家；中間=左棋盤（按高度撐滿）+ 右欄（我的狀態 + 輪到你的提示）；下排=手牌。電腦與手機橫放共用，手機直拿提示轉橫。 */
:root {
  color-scheme: light;
  --ink: #1f2a44; --ink-soft: #55607a; --paper: #f6f1e4; --paper-2: #ece3cd; --blue: #1f4fa3; --blue-deep: #14306a;
  --gold: #c99a2e; --gold-soft: #f2dfa8; --red: #a8322a; --ok: #2d7a4a; --night: #10162a;
  --clay: #b9774a; --glaze: #2f6fc0; --pattern: #3c8a63;
  --display: "PingFang TC", "Microsoft JhengHei", "Heiti TC", "Noto Sans TC", "Noto Sans CJK TC", system-ui, sans-serif; --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --gap: 8px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(rgba(16,22,42,.72), rgba(16,22,42,.86)), url(assets/town.webp) center / cover no-repeat; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.frame-blue { border: 10px solid transparent; border-image: url(assets/ui_card_blue.png) 16 / 10px stretch; }
.frame-gold { border: 10px solid transparent; border-image: url(assets/ui_panel_gold.png) 16 / 10px stretch; }
.panel { background: var(--paper); border-radius: 4px; padding: 8px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.35); min-width: 0; }
.ttl { font-family: var(--display); font-weight: 900; color: var(--blue-deep); font-size: 15px; margin: 0 0 6px; letter-spacing: .04em; }
.muted { color: var(--ink-soft); }
.hint { font-size: 12.5px; color: var(--ink-soft); }
.btn { border: 0; border-radius: 999px; padding: 7px 14px; background: var(--blue); color: #fff; font-weight: 700; box-shadow: 0 3px 0 var(--blue-deep); }
.btn:hover { filter: brightness(1.1); } .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--blue-deep); }
.btn.gold { background: var(--gold); color: #2a1d00; box-shadow: 0 3px 0 #8a6614; }
.btn.ghost { background: rgba(0,0,0,.25); color: var(--paper); box-shadow: inset 0 0 0 1.5px rgba(246,241,228,.5); padding: 5px 12px; }
.btn.plain { background: var(--paper-2); color: var(--ink); box-shadow: 0 3px 0 #c9bd9c; }
.ico { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: -.25em; }

/* ===== 對局畫面：一屏 ===== */
.game { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--gap); }
.top { display: flex; align-items: center; gap: 8px 12px; color: var(--paper); min-width: 0; }
.top .logo { height: 34px; width: auto; flex: none; }
.top .round { font-family: var(--display); font-weight: 900; font-size: 18px; color: var(--gold-soft); white-space: nowrap; flex: none; }
.strip { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.pchip { flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 3px; border-radius: 999px; background: rgba(246,241,228,.94); color: var(--ink); border: 2px solid transparent; font-size: 12px; line-height: 1.15; }
.pchip.me { border-color: var(--gold); }
.pchip.act { box-shadow: 0 0 0 2px #fff, 0 0 12px 2px var(--c); }
.pchip img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; object-position: top; border: 2px solid var(--c); }
.pchip b { font-family: var(--display); font-size: 13px; }
.pchip .vp { font-family: var(--display); font-weight: 900; font-size: 16px; color: var(--blue-deep); display: flex; align-items: center; gap: 2px; }
.pchip .mt { display: block; color: var(--ink-soft); }
.pchip .first { font-size: 10px; background: var(--gold); color: #fff; border-radius: 999px; padding: 0 5px; }
.top .btns { display: flex; gap: 6px; flex: none; }

.mid { display: flex; gap: var(--gap); min-height: 0; min-width: 0; }
.boardbox { flex: none; position: relative; }
.right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
#mine { flex: none; }
#ask { flex: 1; min-height: 0; overflow-y: auto; }

/* 手牌 */
.handbar { display: flex; gap: var(--gap); align-items: stretch; min-width: 0; }
.handbar .lab { flex: none; writing-mode: vertical-rl; font-family: var(--display); font-weight: 900; color: var(--gold-soft); letter-spacing: .2em; font-size: 13px; align-self: center; }
.hand { display: flex; gap: var(--gap); overflow-x: auto; min-width: 0; flex: 1; padding-bottom: 2px; }
.hcard { flex: none; width: 168px; display: grid; grid-template-columns: 64px 1fr; gap: 6px; align-items: start; padding: 5px; border-radius: 8px; background: #fffaf0; border: 2px solid #d7c79e; text-align: left; color: var(--ink); position: relative; }
.hcard.gen { border-color: var(--gold); }
.hcard img { width: 64px; height: 64px; object-fit: cover; border-radius: 5px; }
.hcard .cn { font-family: var(--display); font-weight: 900; color: var(--blue-deep); font-size: 14px; line-height: 1.2; }
.hcard .cn, .hcard .cw, .hcard .cs { display: block; }
.hcard .cw { font-size: 11px; color: var(--ink-soft); line-height: 1.3; margin-top: 2px; }
.hcard .cs { font-size: 11px; font-weight: 700; color: var(--red); line-height: 1.3; }
.hcard.used { filter: grayscale(1); opacity: .5; }
.hcard.used::after { content: "已用"; position: absolute; right: 4px; top: 2px; font-family: var(--display); font-weight: 900; color: var(--red); transform: rotate(12deg); border: 2px solid var(--red); border-radius: 4px; padding: 0 4px; font-size: 12px; background: #fffaf0; }

/* 棋盤 */
.board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(6, 1fr); gap: 3px;
  background: #e9dcc0; padding: 5px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.cell { position: relative; display: grid; gap: 2px; min-width: 0; min-height: 0; }
.cell.splitv { grid-template-rows: 1fr 1fr; } .cell.splith { grid-template-columns: 1fr 1fr; }
.tile { position: relative; border-radius: 5px; background: var(--paper); border: 1.5px solid rgba(31,42,68,.18); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1px; min-width: 0; min-height: 0; cursor: pointer; }
.tile .ti { width: 84%; height: 64%; object-fit: contain; filter: drop-shadow(0 2px 2px rgba(0,0,0,.18)); pointer-events: none; }
.tile .n { font-size: var(--tn, 11px); line-height: 1.1; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tile .sup { position: absolute; top: 1px; right: 3px; font-size: var(--tn, 11px); font-weight: 700; color: var(--ink); }
.tile .own { position: absolute; left: 2px; bottom: 2px; width: 34%; max-width: 22px; aspect-ratio: 1; border-radius: 50%; background-size: cover; border: 2px solid var(--gold); }
.r-tai { background: #f4e6d6; } .r-you { background: #e2ebf7; } .r-wen { background: #e3f0e6; }
.tile.opt { outline: 3px solid var(--gold); outline-offset: -3px; box-shadow: 0 0 0 3px rgba(201,154,46,.35), 0 0 18px rgba(201,154,46,.9); animation: pulse 1.1s ease-in-out infinite; z-index: 2; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(201,154,46,.2), 0 0 6px rgba(201,154,46,.5); } }
.tile.empty .ti { opacity: .4; }
.center { grid-column: 2 / 8; grid-row: 2 / 6; display: grid; grid-template-columns: 1.2fr 1fr; grid-template-rows: auto 1fr; gap: 5px; padding: 3px; min-width: 0; min-height: 0; }
.cbox { background: rgba(255,250,240,.86); border-radius: 6px; padding: 5px 8px; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.cbox h4 { margin: 0; font-family: var(--display); color: var(--blue-deep); font-size: var(--tc, 13px); }
.evmini { font-size: var(--tc, 13px); line-height: 1.3; }
.evmini b { font-family: var(--display); color: var(--red); font-size: calc(var(--tc, 13px) * 1.25); display: block; }
.kilns { display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-end; }
.kilns img { height: calc(var(--tc, 13px) * 2.6); width: auto; }
.bank { font-size: calc(var(--tc, 13px) * .9); color: var(--ink-soft); display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.dicezone { grid-column: 1 / -1; flex-direction: row !important; align-items: center; justify-content: center; gap: 10px; }
.dicezone .who { font-size: var(--tc, 13px); color: var(--ink-soft); }
.dicezone .av { width: calc(var(--tc, 13px) * 3); aspect-ratio: 1; border-radius: 50%; object-fit: cover; object-position: top; border: 2px solid var(--c); }
.die { width: calc(var(--tc, 13px) * 3.6); height: calc(var(--tc, 13px) * 3.6); flex: none; background: #fbfbf8; border-radius: 22%; box-shadow: inset -3px -4px 0 #d9dde6, 0 3px 6px rgba(0,0,0,.25); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: calc(var(--tc, 13px) * .5); }
.die i { width: 70%; aspect-ratio: 1; border-radius: 50%; background: var(--blue); place-self: center; visibility: hidden; }
.die i.on { visibility: visible; }
.die.roll { animation: roll .6s ease-out; }
@keyframes roll { 0% { transform: rotate(-200deg) scale(.6); } 60% { transform: rotate(20deg) scale(1.1); } 100% { transform: none; } }
.tok { position: absolute; z-index: 5; width: var(--ts, 26px); height: var(--ts, 26px); border-radius: 50%; background-size: cover; background-position: center top; border: 2.5px solid var(--c); box-shadow: 0 2px 4px rgba(0,0,0,.4); transition: left .16s ease, top .16s ease; pointer-events: none; }
.tok::after { content: attr(data-s); position: absolute; right: -5px; bottom: -5px; min-width: 14px; height: 14px; border-radius: 7px; background: var(--c); color: #fff; font-size: 9.5px; font-weight: 700; line-height: 14px; text-align: center; padding: 0 2px; font-family: var(--display); }
.tok.active { z-index: 7; box-shadow: 0 0 0 3px #fff, 0 0 14px 4px var(--c); }
.tok.me { box-shadow: 0 0 0 2px var(--gold), 0 2px 6px rgba(0,0,0,.5); }
.tok.hop { animation: hop .16s ease; }
@keyframes hop { 50% { transform: translateY(-30%); } }
.float { position: absolute; z-index: 8; pointer-events: none; background: var(--night); color: var(--gold-soft); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; transform: translate(-50%, -100%); animation: floatup 1s ease forwards; }
@keyframes floatup { 0% { opacity: 0; margin-top: 4px; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; margin-top: -18px; } }

/* 我的狀態（緊湊） */
.me-row { display: flex; gap: 8px; align-items: center; }
.me-row > img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; object-position: top; border: 3px solid var(--gold); flex: none; }
.me-row .nm { font-family: var(--display); font-weight: 900; font-size: 16px; line-height: 1.1; }
.me-row .stat { margin-left: auto; text-align: right; flex: none; }
.chips { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); font-weight: 900; font-size: 20px; color: var(--blue-deep); line-height: 1; }
.chips img { width: 22px; height: 22px; object-fit: contain; }
.mats { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; align-items: center; }
.mat { display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; padding: 1px 8px 1px 2px; font-weight: 700; background: #fff; border: 1.5px solid #ddd; font-size: 13px; }
.mat img { width: 20px; height: 20px; object-fit: contain; }
.mat.need { border-style: dashed; border-color: var(--red); color: var(--red); }
.goal { font-weight: 700; font-size: 13px; } .goal.ok { color: var(--ok); } .goal.need { color: var(--red); }
.where { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

/* 提示面板 */
.ask { display: grid; gap: 6px; }
.ask .q { font-family: var(--display); font-weight: 900; font-size: 16px; color: var(--blue-deep); line-height: 1.3; }
.opts { display: grid; gap: 5px; }
.opt { text-align: left; border: 1.5px solid #d8cba8; background: #fffaf0; border-radius: 8px; padding: 6px 10px; color: var(--ink); min-height: 36px; }
.opt:hover { border-color: var(--gold); background: #fff3d6; }
.opt.skip { color: var(--ink-soft); background: transparent; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bidbox { display: flex; align-items: center; gap: 8px; }
.bidbox button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--paper-2); font-size: 20px; font-weight: 700; }
.bidbox output { font-family: var(--display); font-weight: 900; font-size: 28px; min-width: 2ch; text-align: center; color: var(--blue-deep); }
.chk { display: flex; gap: 6px; align-items: center; }
.waiting { color: var(--ink-soft); font-style: italic; }

/* 遮罩 */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(10,14,28,.66); padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(680px, 96vw); max-height: 92vh; overflow-y: auto; background: var(--paper); border: 12px solid transparent; border-image: url(assets/ui_card_blue.png) 16 / 12px stretch; padding: 12px; display: grid; gap: 10px; }
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 900; color: var(--blue-deep); font-size: 19px; }
.evcard { width: min(300px, 80vw); text-align: center; padding: 18px 16px; background: #fffaf0; border: 14px solid transparent; border-image: url(assets/ui_panel_gold.png) 16 / 14px stretch; animation: flip .7s ease; }
@keyframes flip { 0% { transform: perspective(600px) rotateY(90deg) scale(.7); opacity: 0; } 100% { transform: none; opacity: 1; } }
.evcard .k { font-size: 12px; letter-spacing: .3em; color: var(--gold); font-weight: 700; }
.evcard .t { font-family: var(--display); font-weight: 900; font-size: 28px; color: var(--red); margin: 4px 0; }
.bids { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.bid { text-align: center; padding: 6px; border-radius: 10px; background: #fff; border: 2px solid #e4d9bd; display: grid; gap: 3px; justify-items: center; animation: pop .45s ease both; position: relative; }
@keyframes pop { 0% { transform: perspective(500px) rotateY(80deg) scale(.85); } 100% { transform: none; } }
.bid .av { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; object-position: top; border: 3px solid var(--c); }
.bid .amt { font-family: var(--display); font-weight: 900; font-size: 24px; color: var(--blue-deep); line-height: 1; }
.bid .res { font-size: 12px; line-height: 1.3; }
.bid .kf { height: 46px; width: auto; }
.bid.win { border-color: var(--gold); background: #fff6dc; }
.bid.fire { box-shadow: 0 0 0 2px #e2572b, 0 0 22px rgba(255,120,40,.75); }
.bid.fire .res { color: #b8410e; font-weight: 700; }
.bid.waste .res { color: var(--red); }
.badge { font-size: 11px; font-weight: 700; color: #fff; background: var(--gold); border-radius: 999px; padding: 1px 8px; }
.bigcard { width: min(420px, 92vw); max-height: 92vh; overflow-y: auto; background: #fffaf0; border: 14px solid transparent; border-image: url(assets/ui_card_blue.png) 16 / 14px stretch; display: grid; gap: 6px; padding: 8px; }
.bigcard.gen { border-image-source: url(assets/ui_panel_gold.png); }
.bigcard img { width: 100%; aspect-ratio: 4 / 3; max-height: 48vh; object-fit: cover; border-radius: 6px; }
.bigcard .cn { font-family: var(--display); font-weight: 900; font-size: 22px; color: var(--blue-deep); }
.bigcard .ct { font-size: 11px; color: var(--gold); font-weight: 700; letter-spacing: .1em; }
.players { display: grid; gap: 6px; }
.pl { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 8px; background: #fffaf0; border: 1.5px solid transparent; }
.pl.me { border-color: var(--gold); }
.pl img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: top; border: 2.5px solid var(--c); }
.pl .nm { font-weight: 700; } .pl .st { font-size: 12px; color: var(--ink-soft); display: flex; gap: 8px; flex-wrap: wrap; }
.pl .vp { font-family: var(--display); font-weight: 900; font-size: 20px; color: var(--blue-deep); text-align: right; line-height: 1; }
.pl .vp small { display: block; font-family: var(--body); font-size: 10px; font-weight: 500; color: var(--ink-soft); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 0; border-radius: 999px; padding: 5px 12px; background: var(--paper-2); font-weight: 700; }
.tabs button.on { background: var(--blue); color: #fff; }
.leg { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 12px; font-size: 12.5px; }
.leg > div { display: flex; align-items: center; gap: 6px; }
.leg img { width: 30px; height: 30px; object-fit: contain; flex: none; }
.lg2 { flex: none; min-width: 30px; height: 20px; border-radius: 4px; border: 1.5px solid #d8cba8; background: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 3px; }
.lg2.glow { border-color: var(--gold); box-shadow: 0 0 8px rgba(201,154,46,.9); }
.log { font-size: 12.5px; }
.log .rh { font-weight: 700; color: var(--blue-deep); margin-top: 6px; }
.log .me { color: var(--blue); }
.rotate { display: none; }
.toast { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 9; max-width: 90%; background: rgba(16,22,42,.92); color: var(--gold-soft); font-size: 12.5px; padding: 5px 12px; border-radius: 10px; transition: opacity .3s; pointer-events: none; }
@media (orientation: portrait) and (max-width: 700px) {
  .game:not(.portrait-ok) .rotate { display: grid; position: fixed; inset: 0; z-index: 60; place-items: center; background: var(--night); color: var(--paper); text-align: center; padding: 24px; }
  .rotate .ph { width: 70px; height: 120px; border: 4px solid var(--gold-soft); border-radius: 14px; margin: 0 auto 18px; animation: tilt 2s ease-in-out infinite; }
  @keyframes tilt { 50% { transform: rotate(-90deg); } }
  .game.portrait-ok { height: auto; grid-template-rows: auto; }
  .game.portrait-ok .mid { flex-direction: column; }
  .game.portrait-ok .strip { flex-wrap: wrap; }
}

/* 小屏橫放（手機） */
@media (max-height: 520px) {
  :root { --gap: 6px; }
  body { padding-block: 6px; font-size: 13px; }
  .top .logo { display: none; }
  .top .round { font-size: 15px; }
  .pchip { padding: 2px 6px 2px 2px; gap: 4px; }
  .pchip img { width: 24px; height: 24px; }
  .pchip .nmw, .pchip .mt { display: none; }
  .btn.ghost { padding: 4px 9px; font-size: 12px; }
  .panel { padding: 6px 8px; }
  .frame-blue, .frame-gold { border-width: 7px; border-image-width: 7px; }
  .me-row > img { width: 32px; height: 32px; border-width: 2px; }
  .me-row .nm { font-size: 14px; } .me-row .hint { display: none; }
  .chips { font-size: 16px; } .chips img { width: 18px; height: 18px; }
  .where { display: none; }
  .ask .q { font-size: 14px; }
  .opt { padding: 4px 8px; font-size: 12.5px; min-height: 32px; }
  .hcard { width: 132px; grid-template-columns: 40px 1fr; padding: 3px; gap: 4px; }
  .hcard img { width: 40px; height: 40px; }
  .hcard .cn { font-size: 12.5px; } .hcard .cw { display: none; } .hcard .cs { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hcard { max-height: 52px; overflow: hidden; }
  .handbar .lab { display: none; }
  .tok::after { display: none; }
  .bigcard { width: min(640px, 94vw); grid-template-columns: 1fr 1fr; align-items: start; }
  .bigcard img { grid-row: span 6; max-height: 80vh; }
  .ask .hint { font-size: 11.5px; }
}

/* ===== 開局 ===== */
.setup { width: 100%; max-width: 1040px; margin: 0 auto; display: grid; gap: 12px; padding-bottom: 20px; }
.hero { text-align: center; color: var(--paper); display: grid; justify-items: center; gap: 4px; }
.hero img { width: min(380px, 70vw); height: auto; }
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.ch { position: relative; border: 3px solid transparent; border-radius: 10px; overflow: hidden; background: #2a3150; padding: 0; text-align: left; color: #fff; aspect-ratio: 3 / 4; }
.ch img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.ch .lab { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; background: linear-gradient(transparent, rgba(10,14,28,.92)); }

// ---------- 驅動 ----------
async function step(ans) {
  if (BUSY) return; if (PEND && SAVE) SAVE.answers.push(ans === undefined ? { u: 1 } : { v: ans }); BUSY = true; PEND = null; renderAsk(); const ep = EPOCH;
  let r; try { r = IT.next(ans); } catch (e) { console.error(e); BUSY = false; $('#ask').innerHTML = `<div class="err">出錯了：${esc(e.message)}</div>`; return; }
  await playback(ep);
  if (ep !== EPOCH) return;
  BUSY = false;
  VS = liveVS(); renderAll();
  if (r.done) { clearSave(); showEnd(r.value); return; }
  PEND = r.value; saveGame();
  if (PEND.kind === 'move') { if (FAST) { DICE = { p: ME, d: PEND.data.dice }; renderDice(); } else { PEND.needRoll = true; DICE = null; renderDice(); } }
  if (PEND.kind === 'auctionResult') { showAuction(PEND.data); return; }
  renderAsk(); renderBoard();
}
async function playback(ep) {
  const L = G.logs;
  while (SHOWN < L.length) { if (ep !== EPOCH) return;
    const l = L[SHOWN++];
    if (l.type === 'ask' || l.type === 'end') continue;
    await playOne(l);
  }
}
async function playOne(l) {
  const prev = VS;
  const next = { snap: l.snap, shops: l.shops, supply: l.supply, bank: l.bank, round: l.round, ev: l.ev };
  switch (l.type) {
    case 'round': VS = next; renderAll(); await showEvent(l.ev, l.round); return;
    case 'income': VS = next; renderPlayers(); renderMine(); await sleep(60); return;
    case 'dice': if (l.p === ME) { VS = next; return; } DICE = { p: l.p, d: l.dice }; renderPlayers(); await tumble(l.p, l.dice, 700); await sleep(250); VS = next; renderPlayers(); return;
    case 'move': {
      document.querySelectorAll('.tok.active').forEach(t => t.classList.remove('active')); const tkA = document.querySelector(`[data-tok="${l.p}"]`); if (tkA) tkA.classList.add('active');
      const path = l.path; for (const node of path) { prev.snap[l.p] = Object.assign({}, prev.snap[l.p], { pos: node }); VS = prev; placeTokens(l.p); await sleep(170); }
      VS = next; renderAll(); floatAt(l.p, shortText(l)); await sleep(350); return; }
    case 'auction': case 'bids': VS = next; renderAll(); return;
    default: VS = next; renderAll(); if (l.text) { floatAt(l.p != null ? l.p : ME, shortText(l)); await sleep(l.type === 'fire' || l.type === 'win' ? 300 : 520); }
  }
}

// ---------- 存檔：記下種子和你的每個決定，讀檔時重放 ----------
const SKEY = 'cdl_save_v1';
function hasSave() { try { return !!localStorage.getItem(SKEY); } catch (e) { return false; } }
function saveGame() { if (!SAVE || !G) return; try { localStorage.setItem(SKEY, JSON.stringify(SAVE)); } catch (e) {} }
function clearSave() { try { localStorage.removeItem(SKEY); } catch (e) {} }
function revive(pend, v) { if (v === null || typeof v !== 'object') return v; const key = JSON.stringify(v); let hit;
  (function walk(o) { if (hit || !o || typeof o !== 'object') return; if (Array.isArray(o)) { for (const x of o) { if (x && typeof x === 'object' && JSON.stringify(x) === key) { hit = x; return; } walk(x); } } else for (const k in o) walk(o[k]); })(pend.data);
  return hit || v; }
function loadGame() {
  let sv; try { sv = JSON.parse(localStorage.getItem(SKEY)); } catch (e) {} if (!sv) return renderHome();
  Object.assign(SETUP, sv.setup); SAVE = sv;
  G = new E.Game5({ chars: [sv.setup.c, ...sv.setup.others], seed: sv.seed, rules: RULES, humans: [0], log: true }); ME = 0;
  G.players.forEach((p, i) => { if (i === 0) G.setup(p, 'balanced', sv.setup.ex.concat(sv.setup.ge)); else { const f = FIELD[p.c] || { id: 'balanced', cards: E.EXCL[p.c].slice(0, 2).concat(['q_tui', 'q_buhuo']) }; G.setup(p, f.id, f.cards); } });
  IT = G.gen(); let r; EPOCH++;
  try { r = IT.next(); for (const a of sv.answers) { if (r.done) break; r = IT.next(a.u ? undefined : revive(r.value, a.v)); } } catch (e) { console.error(e); clearSave(); return renderHome(); }

  PEND = r.value;
  if (PEND.kind === 'move') PEND.needRoll = true;
  if (PEND.kind === 'auctionResult') { showAuction(PEND.data); return; }
  renderAsk(); renderBoard(); renderPlayers();
}

  $('#ovx').onclick = () => { $('#ov').innerHTML = ''; };
  document.querySelectorAll('[data-tp]').forEach(b => b.onclick = () => showTutorial(+b.dataset.tp));
  $('#tPrev').onclick = () => showTutorial(i - 1);

}
