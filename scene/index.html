function shrub(x,z,sz=1){const y=Math.max(.06,landHeight(x,z));for(let j=0;j<7;j++){const a=j/7*Math.PI*2,r=.15+rand()*.17;const leaf=mesh(smallSphere,['#647538','#82934e','#9ca361'][j%3],[x+Math.cos(a)*r*sz,y+.12*sz,z+Math.sin(a)*r*sz],[.09*sz,.095*sz,.23*sz]);leaf.rotation.set(.35+(rand()-.5)*.25,Math.PI/2-a,(rand()-.5)*.25);}}
for(let i=0;i<1900;i++){const a=rand()*Math.PI*2,r=rand()>.42?(.87+rand()*.1):(.24+rand()*.55),x=Math.cos(a)*16.6*r,z=Math.sin(a)*12.2*r;if(nearTile(x,z,1.35)||riverDist(x,z)<.95||Math.hypot(x+.6,z+.7)<4.7||(x>-5&&x<4.2&&z>1&&z<5.8)||Math.hypot(x+8.6,z+8.3)<3.3||Math.hypot(x+11.1,z-6.5)<3.3||Math.hypot(x-10.3,z+6.4)<3)continue;const y=landHeight(x,z);if(i%2===0)shrub(x,z,.6+rand()*.85);if(i%7===0)blob('#a49a7c',[x+.3,y+.13,z],[.18,.15,.16]);}

for(let i=0;i<65;i++){const t=i/64,p=riverCurve.getPoint(t),v=riverCurve.getTangent(t);for(const sign of [-1,1]){const xx=p.x-v.z*(1.12+rand()*.25)*sign,zz=p.z+v.x*(1.12+rand()*.25)*sign;if(!nearTile(xx,zz,1.15)){shrub(xx,zz,.75);if(i%3===0)blob('#8f9180',[xx,.16,zz],[.3,.25,.28]);}}}
for(let i=0;i<150;i++){const a=rand()*Math.PI*2,r=.77+rand()*.2,x=Math.cos(a)*16.5*r,z=Math.sin(a)*12*r;if(nearTile(x,z,1.4)||riverDist(x,z)<1.1||Math.hypot(x+11.1,z-6.5)<3)continue;const moss=blob(['#92945c','#7a854b','#a3a66b'][i%3],[x,.12,z],[.3+rand()*.5,.14+rand()*.15,.3+rand()*.45]);for(let k=0;k<3;k++)shrub(x+(rand()-.5),z+(rand()-.5),.7);}
// White blossoms identify the tree on the left edge of the reference.
for(let i=0;i<30;i++){const a=rand()*Math.PI*2,r=.55+rand()*.7,x=-14.3+Math.cos(a)*r,y=2.2+rand()*.9,z=.5+Math.sin(a)*r;for(let k=0;k<5;k++){const q=k/5*Math.PI*2;blob('#fff0d4',[x+Math.cos(q)*.10,y,z+Math.sin(q)*.10],[.09,.035,.055]);}blob('#d3a545',[x,y+.02,z],[.045,.03,.045]);}
for(let i=0;i<180;i++){const a=rand()*Math.PI*2,x=Math.sign(Math.cos(a))*Math.pow(Math.abs(Math.cos(a)),.78)*(16.0+rand()*.4),z=Math.sign(Math.sin(a))*Math.pow(Math.abs(Math.sin(a)),.78)*(11.4+rand()*.5);if(nearTile(x,z,1.25)||(x>4.5&&x<8&&z>9))continue;shrub(x,z,.85+rand()*.45);if(i%5===0)blob('#8e9270',[x,.18,z],[.33,.24,.31]);}
// Hand-shaped paving stones around the furnace courtyard.
for(let row=0;row<8;row++)for(let col=0;col<12;col++){const x=-4.5+col*.69+(row%2)*.26,z=2.5+row*.40;if(riverDist(x,z)<1.05||nearTile(x,z,1.2))continue;const stone=box(['#d0af83','#d8bc94','#c6a17a'][Math.floor(rand()*3)],[x,.115,z],[.55+rand()*.04,.13,.36+rand()*.04],.045);stone.rotation.y=(rand()-.5)*.09;}
// Wood piles, clay sacks, shelves and a working pottery wheel.
for(let i=0;i<16;i++){const xx=-3.5+(i%4)*.22,yy=.18+Math.floor(i/4)*.18;const log=cyl('#8e663e',[xx,yy,1.1],.10,.12,.9,kiln);log.rotation.x=Math.PI/2;}
const wheel=cyl('#b59165',[-2.25,.45,1.5],.45,.55,.15,kiln);cyl('#94764e',[-2.25,.21,1.5],.12,.17,.45,kiln);pot(-2.25,.53,1.5,.45,'#b77c57',kiln);
for(let i=0;i<7;i++){const x=1.4+(i%3)*.45,z=2.2+Math.floor(i/3)*.5;pot(x,.05,z,.6+rand()*.2,['#a4b5ad','#b27d55','#d3c19e'][i%3],kiln);}
for(let i=0;i<5;i++){const xx=-4.7+i*.37;blob('#b69568',[xx,.35,2.1],[.24,.33,.24],kiln);cyl('#927248',[xx,.65,2.1],.07,.11,.09,kiln);}

for(let i=0;i<38;i++){const x=-8.8+rand()*4.5,z=3.7+rand()*3.5;if(nearTile(x,z,1.3))continue;if(i%2===0)shrub(x,z,.7);else {const b=box('#bba07b',[x,.13,z],[.3,.18,.22],.035);b.rotation.y=rand()*2;}}
for(let i=0;i<35;i++){const a=i/35*Math.PI*2,p=riverCurve.getPoint(.2+rand()*.7);if(nearTile(p.x,p.z,1.6))continue;blob(['#a2a38c','#6f8969','#8c9980'][i%3],[p.x+(rand()-.5)*1.2,.115,p.z],[.1+rand()*.14,.04,.1+rand()*.13]);}
// A short waterfall carries the stream down the front clay bank.
const fall=new T.Mesh(new T.PlaneGeometry(1.35,2.1,8,18),new T.MeshStandardMaterial({color:'#87b9ac',roughness:.25,metalness:.05,side:T.DoubleSide,transparent:true,opacity:.8}));fall.position.set(6.4,-.9,11.9);scene.add(fall);
for(let i=0;i<14;i++)blob('#c9d9c4',[5.85+rand()*1.2,-1.95,11.9+rand()*.35],[.1+rand()*.1,.04,.1]);
// Merge all static clay meshes by material to keep the scene lightweight.
scene.updateMatrixWorld(true);const buckets=new Map();for(const m of baked){const key=m.material.uuid;let b=buckets.get(key);if(!b)buckets.set(key,b={material:m.material,geometries:[]});const geom=m.geometry.clone().applyMatrix4(m.matrixWorld);if(!geom.attributes.normal)geom.computeVertexNormals();const expanded=geom.index?geom.toNonIndexed():geom;for(const a of Object.keys(expanded.attributes))if(!['position','normal','uv'].includes(a))expanded.deleteAttribute(a);if(!expanded.attributes.uv)expanded.setAttribute('uv',new T.Float32BufferAttribute(new Float32Array(expanded.attributes.position.count*2),2));b.geometries.push(expanded);m.removeFromParent();}
for(const b of buckets.values()){const merged=mergeGeometries(b.geometries,false);if(!merged)throw Error('場景幾何合併失敗');const m=new T.Mesh(merged,b.material);m.castShadow=m.receiveShadow=true;scene.add(m);b.geometries.forEach(g=>g.dispose());}
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const ao=new SSAOPass(scene,camera,innerWidth,innerHeight);ao.kernelRadius=1.0;ao.minDistance=.001;ao.maxDistance=.11;composer.addPass(ao);const smokePass=new RenderPass(smokeScene,camera);smokePass.clear=false;composer.addPass(smokePass);composer.addPass(new OutputPass());
let low=false,tween=null;const wide=()=>innerWidth/innerHeight>1.2;function moveTo(pos,target){controls.autoRotate=false;$('#spin').setAttribute('aria-pressed','false');tween={from:camera.position.clone(),to:new T.Vector3(...pos),targetFrom:controls.target.clone(),targetTo:new T.Vector3(...target),start:performance.now()};}
function home(){moveTo(wide()?[-4,22.5,32]:[54,63,79],[0,-.8,0]);}camera.position.set(...(wide()?[-4,22.5,32]:[54,63,79]));controls.update();$('#home').onclick=home;$('#kiln').onclick=()=>moveTo([7,8.4,14],[-.6,2.3,-.5]);$('#river').onclick=()=>moveTo([14,9,14],[5,.2,2.5]);$('#spin').onclick=()=>{tween=null;controls.autoRotate=!controls.autoRotate;$('#spin').setAttribute('aria-pressed',String(controls.autoRotate));};controls.addEventListener('start',()=>{tween=null;controls.autoRotate=false;$('#spin').setAttribute('aria-pressed','false');});$('#quality').onclick=()=>{low=!low;renderer.setPixelRatio(low?1:Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=!low;ao.enabled=!low;composer.setPixelRatio(low?1:Math.min(devicePixelRatio,1.6));scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});$('#quality').setAttribute('aria-pressed',String(low));};
const ray=new T.Raycaster();let pointerStart=null,selected=null;renderer.domElement.addEventListener('pointerdown',e=>pointerStart=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!pointerStart||Math.hypot(e.clientX-pointerStart[0],e.clientY-pointerStart[1])>5)return;const r=renderer.domElement.getBoundingClientRect();ray.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);const hit=ray.intersectObjects(picks)[0];if(!hit)return;if(selected)selected.material=tileMaterials.get(selected.userData.id);selected=hit.object;selected.material=material('#b9cb97');const id=selected.userData.id,t=MAP4[id],desc={mat:'取得對應材料',shop:'購買店鋪或支付租金',market:'進行材料交易',shrine:'取得本輪競價加成',lucky:'吉祥格',prank:'抽取整蠱事件',fortune:'財神格',dock:'渡口交易',any:'選擇材料',start:'經過起點領取銀兩'};$('#info').replaceChildren();const title=document.createElement('strong');title.textContent=tileName(t)+' · '+id;$('#info').append(title,document.createTextNode(desc[t.t]+'｜下一格：'+t.n.map(n=>tileName(MAP4[n])).join(' / ')));});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

let last=0;renderer.setAnimationLoop(now=>{if(document.hidden)return;if(low&&now-last<32)return;const dt=Math.min((now-last)/1000,.06);last=now;const t=now/1000;wave.offset.y=-t*.025;if(tween){const u=Math.min((now-tween.start)/1000,1),v=u*u*(3-2*u);camera.position.lerpVectors(tween.from,tween.to,v);controls.target.lerpVectors(tween.targetFrom,tween.targetTo,v);if(u===1)tween=null;}controls.update(dt);fireLight.intensity=23+Math.sin(t*5)*2;flames.forEach((f,i)=>f.scale.y=.55+(i%3)*.12+Math.sin(t*4+i)*.08);smokes.forEach((s,i)=>{const u=((t*.10+i/9)%1);s.position.set(-.6+Math.sin(u*4+t*.2)*u*.5,6.8+u*2.7,-1.05+u*.3);s.scale.setScalar(.5+u*1.4);s.material.opacity=(1-u)*.4;});ripples.forEach((r,i)=>{r.scale.setScalar(.8+Math.sin(t+i)*.15);r.material.opacity=.3+Math.sin(t*1.3+i)*.12;});composer.render();});
