<body><header><small>CI JIAN YOU / SPATIAL STUDY 02</small><h1>老窯廠 · 院落</h1><p>陶溪川工業遺產 × 復古陶作街區　／　白模研究</p></header><nav aria-label="白模視角"><button id="overview" aria-pressed="true">全景</button><button id="plan" aria-pressed="false">俯視佈局</button><button id="court" aria-pressed="false">走進院落</button><button id="toggle" aria-pressed="true">空間標註</button></nav><div id="labels"></div><footer><div class="caption"><strong id="viewtitle">兩座建築，一個開放院落</strong>依實景空間關係改編 · 尺寸為設計推估，非測繪復原<br>白模階段：確認建築比例、間距與動線</div><div class="hint">拖曳旋轉 · 滾輪縮放 · 右鍵平移<br>手機：單指旋轉 · 雙指縮放</div></footer><div id="loading" role="status">正在搭建老窯廠…</div>

<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#e9e7e2');
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,300);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.prepend(renderer.domElement);renderer.domElement.setAttribute('aria-label','可旋轉的老窯廠三維白模');
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=12;controls.maxDistance=115;controls.maxPolarAngle=Math.PI/2-.035;
scene.add(new T.HemisphereLight(0xffffff,0xb8b9b2,2.2));const sun=new T.DirectionalLight(0xfffdf8,3.2);sun.position.set(-28,48,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-40,right:40,top:35,bottom:-35,near:1,far:130});sun.shadow.normalBias=.035;sun.shadow.bias=-.0001;sun.shadow.radius=4;scene.add(sun);
const mat=(c)=>new T.MeshStandardMaterial({color:c,roughness:.95});const wall=mat('#eeeFe9'),roof=mat('#bfc3bc'),trim=mat('#e3e5dc'),dark=mat('#818b80'),base=mat('#d1d4c9'),pave=mat('#e1e3da'),pool=mat('#a5b0a5');
function mesh(g,m,x=0,y=0,z=0,parent=scene){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;}
function box(w,h,d,x,y,z,m=wall,p=scene){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z,p)}
box(200,.1,200,0,-.95,0,mat('#e9e7e2'));box(56,.8,40,0,-.45,0,base);box(54,.12,38,0,.01,0,pave);
// Three connected pitched-roof bays give the main hall an old kiln-factory silhouette.
function gable(w,d,eave,rise,x,z,parent){box(w,eave,d,x,eave/2,z,wall,parent);const shape=new T.Shape();shape.moveTo(-w/2,0);shape.lineTo(w/2,0);shape.lineTo(0,rise);shape.closePath();const g=new T.ExtrudeGeometry(shape,{depth:d,bevelEnabled:false});mesh(g,wall,x,eave,z-d/2,parent);const slope=Math.hypot(w/2+.35,rise+.15),angle=Math.atan2(rise+.15,w/2+.35);for(const side of [-1,1]){const slab=box(slope,.18,d+.85,x+side*(w/4+.175),eave+rise/2+.1,z,roof,parent);slab.rotation.z=-side*angle;}box(.22,.23,d+.9,x,eave+rise+.18,z,trim,parent);}
const hall=new T.Group();scene.add(hall);for(let i=0;i<3;i++)gable(7,10,5,1.9,-17+i*7,-10,hall);
// Recess-like dark openings and thick lintels; no textures or decoration in this study.
for(let i=0;i<3;i++){let x=-17+i*7;box(2.8,3.15,.06,x,1.58,-4.96,dark);box(3.25,.28,.35,x,3.3,-4.8,trim);for(const dx of [-2.35,2.35]){box(.95,1.55,.08,x+dx,3.35,-4.94,dark);box(.07,1.55,.1,x+dx,3.35,-4.86,trim);box(.95,.07,.1,x+dx,3.35,-4.86,trim);}box(.24,5,.3,x-3.35,2.5,-4.8,trim);}
box(22,.22,1.5,-10,.13,-3.8,trim);box(22,.12,.65,-10,.05,-2.7,base);
// Chimney attached to the factory yard, not isolated as a central fantasy kiln.
box(3,1.3,3,4,.65,-9,trim);mesh(new T.CylinderGeometry(.65,1.03,16,32),wall,4,9.2,-9);for(const y of [2.2,8.5,15.5,17.25])mesh(new T.CylinderGeometry(y>17?.85:.92,y>17?.85:.92,.16,32),trim,4,y,-9);mesh(new T.CylinderGeometry(.49,.49,.04,32),dark,4,17.3,-9);
// One small traditional workshop with a deep wooden-porch massing.
gable(7.2,5.5,3.4,1.65,-17,9,scene);box(7.8,.28,7.4,-17,.14,9.4,trim);for(const x of [-19.9,-17,-14.1])box(.2,2.9,.2,x,1.72,13,trim);const awning=box(8,.17,2.3,-17,3.2,12.55,roof);awning.rotation.x=.16;box(8,.2,.2,-17,3.05,13.65,trim);box(1.8,2.6,.07,-17,1.6,11.79,dark);for(const x of [-19.4,-14.6]){box(1.25,1.35,.08,x,2.05,11.8,dark);box(.08,1.35,.1,x,2.05,11.86,trim);}
// Shallow rectangular reflecting basin and broad unobstructed courtyard.
box(12,.06,7.5,8,.09,-.8,pool);for(const x of [1.8,14.2])box(.35,.28,8.2,x,.18,-.8,trim);for(const z of [-4.75,3.15])box(12.7,.28,.35,8,.18,z,trim);
// Only three market canopies, set to one side rather than surrounding the board.
for(let i=0;i<3;i++){const x=21,z=-8+i*6;box(3.8,.15,3.6,x,.14,z,trim);for(const dx of [-1.5,1.5])for(const dz of [-1.3,1.3])box(.13,2.7,.13,x+dx,1.5,z+dz,trim);const canopy=box(3.9,.16,3.7,x,2.95,z,roof);canopy.rotation.z=.05;box(2.7,.9,.85,x,.65,z+.65,wall);}
// Broad circulation strips and low yard edges remain simple geometry.
box(37,.025,3.5,2,.09,10,pave);for(const x of [-25,25])box(.35,.55,10,x,.35,11,trim);box(8,.55,.35,-21,.35,17,trim);box(12,.55,.35,19,.35,17,trim);
for(const [x,z] of [[-5,12],[12,12]]){box(3,.35,.65,x,.65,z,trim);for(const dx of [-1,1])box(.25,.5,.5,x+dx,.3,z,base);}
// Sparse paving joints convey scale without disguising the plan in decoration.
const lineMat=new T.LineBasicMaterial({color:0xc5c9be,transparent:true,opacity:.45});for(let x=-10;x<=16;x+=2){const g=new T.BufferGeometry().setFromPoints([new T.Vector3(x,.09,5),new T.Vector3(x,.09,16)]);scene.add(new T.Line(g,lineMat));}for(let z=5;z<=16;z+=2){const g=new T.BufferGeometry().setFromPoints([new T.Vector3(-10,.09,z),new T.Vector3(16,.09,z)]);scene.add(new T.Line(g,lineMat));}
const labels=[];function label(t,x,y,z){const el=document.createElement('div');el.className='label';el.textContent=t;document.querySelector('#labels').append(el);labels.push({el,p:new T.Vector3(x,y,z)});}label('01 老廠房 · 三跨坡屋頂',-10,8,-10);label('02 窯廠煙囪',4,18,-9);label('03 復古陶作工坊',-17,5.7,9);label('04 水院',8,.4,-.8);label('05 三席小市集',21,3.6,-2);label('開放院落 · 約 8 m 主要通行淨寬',1,.4,10);
const views={overview:{p:[48,43,57],t:[0,2,0],title:'兩座建築，一個開放院落'},plan:{p:[0,75,.1],t:[0,0,0],title:'建築靠邊，院落與通路留在中央'},court:{p:[11,6.5,25],t:[-7,3,-7],title:'從院落看老廠房與窯廠煙囪'}};let current='overview';function setView(id){current=id;camera.position.fromArray(views[id].p);controls.target.fromArray(views[id].t);controls.update();for(const key of Object.keys(views))document.getElementById(key).setAttribute('aria-pressed',String(id===key));document.getElementById('viewtitle').textContent=views[id].title;}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>setView(id);document.querySelector('#toggle').onclick=(e)=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));document.querySelector('#labels').hidden=!on;};setView('overview');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});const v=new T.Vector3();renderer.setAnimationLoop(()=>{controls.update();for(const {el,p}of labels){v.copy(p).project(camera);el.style.left=(v.x*.5+.5)*innerWidth+'px';el.style.top=(-v.y*.5+.5)*innerHeight-20+'px';el.style.display=v.z<1&&v.z>-1?'block':'none';}renderer.render(scene,camera);});document.getElementById('loading').remove();
